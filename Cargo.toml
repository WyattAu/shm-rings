[package]
name = "shm-rings"
version = "0.2.1"
edition = "2021"
rust-version = "1.85"
description = "Lock-free SPMC shared-memory ring buffer: power-of-two masked indices, 256-byte cache-aligned versioned header, backpressure-only, zero SeqCst"
license = "MIT OR Apache-2.0"
repository = "https://github.com/WyattAu/shm-rings"
readme = "README.md"
keywords = ["shm", "ring-buffer", "spmc", "lock-free", "ipc"]
categories = ["concurrency", "memory-management"]
exclude = ["/target", "fuzz"]

[dependencies]
memmap2 = "0.9"
zerocopy = { version = "0.8", features = ["derive"] }
thiserror = "2"
loom = { version = "0.7", features = ["futures"], optional = true }
libc = { version = "0.2", optional = true }

[dev-dependencies]
criterion = "0.5"
iai-callgrind = "0.16"
proptest = "1"
tempfile = "3"

[features]
default = ["std"]
std = []
loom = ["dep:loom"]
# Linux eventfd-based wakeup for blocking consumers (`notify` module).
notify = ["dep:libc"]

[[test]]
name = "integration"

[[test]]
name = "proptest"

[[test]]
name = "loom"
required-features = ["loom"]

[[test]]
name = "loan"

[[test]]
name = "notify"
required-features = ["notify"]

[[bench]]
name = "ring_bench"
harness = false

[[bench]]
name = "loan_bench"
harness = false

[[bench]]
name = "notify_bench"
harness = false
required-features = ["notify"]

# Deterministic CI perf gate (instruction counts under valgrind). Not run
# locally unless valgrind is installed; see benches/iai_ring.rs.
[[bench]]
name = "iai_ring"
harness = false

[lints.clippy]
unwrap_used = "warn"
expect_used = "warn"
